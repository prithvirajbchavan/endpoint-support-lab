<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FixDesk · Endpoint Troubleshooting &amp; Remote Support Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0f1c;--sf:#111a2e;--sf2:#16223b;--ink:#e6edf7;--mut:#8da0bd;--line:#223152;--ac:#22d3ee;--acx:#04202a;--ok:#34d399;--warn:#fbbf24;--bad:#fb7185;--vi:#a78bfa;color-scheme:dark}
:root[data-theme=light]{--bg:#eef3f9;--sf:#fff;--sf2:#f1f5fb;--ink:#0f1b33;--mut:#5a6b88;--line:#d7e0ee;--ac:#0e7490;--acx:#fff;--ok:#047857;--warn:#b45309;--bad:#be123c;--vi:#6d28d9;color-scheme:light}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,sans-serif}
.mono{font-family:"JetBrains Mono",ui-monospace,Consolas,monospace}
header{display:flex;align-items:center;gap:18px;padding:12px 28px;border-bottom:1px solid var(--line);background:var(--sf);position:sticky;top:0;z-index:5}
.brand{font:600 17px "JetBrains Mono",ui-monospace,monospace;display:flex;gap:9px;align-items:center}.brand i{width:30px;height:30px;border-radius:8px;background:var(--ac);color:var(--acx);display:grid;place-items:center;font-style:normal}.brand span{color:var(--ac)}
nav{display:flex;gap:4px;flex:1}.nv{background:none;border:0;color:var(--mut);font:500 14px Inter;padding:8px 14px;border-radius:8px;cursor:pointer}.nv:hover{color:var(--ink)}.nv[aria-current=page]{background:var(--sf2);color:var(--ac)}
.btn{background:var(--ac);color:var(--acx);border:0;border-radius:8px;padding:8px 14px;font:600 13px Inter;cursor:pointer}.btn.alt{background:var(--sf2);color:var(--ink);border:1px solid var(--line)}.btn.bad{background:transparent;color:var(--bad);border:1px solid var(--bad)}.btn.ok{background:var(--ok);color:#04201a}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
main{max-width:1240px;margin:0 auto;padding:24px 28px 60px}
h1{font:700 24px Inter;margin:0 0 2px}h2{font:600 15px Inter;margin:0 0 12px}.sub{color:var(--mut);margin:0 0 20px}
.card{background:var(--sf);border:1px solid var(--line);border-radius:12px;padding:18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}.kpi b{font:700 28px "JetBrains Mono",monospace;display:block;color:var(--ac)}.kpi span{color:var(--mut);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}
.bar{display:grid;grid-template-columns:110px 1fr 26px;gap:10px;align-items:center;margin:9px 0;font-size:13px}.bar .t{height:8px;background:var(--sf2);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}.bar b{text-align:right}
.split{display:grid;grid-template-columns:360px 1fr;gap:16px;align-items:start}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.chip{border:1px solid var(--line);background:var(--sf);color:var(--mut);border-radius:20px;padding:4px 12px;font:500 12px Inter;cursor:pointer}.chip[aria-pressed=true]{background:var(--ac);color:var(--acx);border-color:var(--ac)}
input{width:100%;font:inherit;color:var(--ink);background:var(--sf);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:10px}
.rb{display:block;width:100%;text-align:left;background:var(--sf);border:1px solid var(--line);border-left:3px solid transparent;color:var(--ink);border-radius:10px;padding:11px 13px;margin-bottom:8px;cursor:pointer;font:inherit}.rb:hover{background:var(--sf2)}.rb.on{border-left-color:var(--ac);background:var(--sf2)}.rb b{display:block}.rb small{color:var(--mut)}
.pill{display:inline-block;border-radius:20px;padding:1px 10px;font:600 11px Inter;background:var(--sf2);color:var(--ac);border:1px solid var(--line)}.pill.ok{color:var(--ok)}.pill.bad{color:var(--bad)}.pill.warn{color:var(--warn)}
.det{position:sticky;top:76px}.det h1{font-size:21px;margin:6px 0}
.lab{font:600 11px Inter;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:16px 0 8px}
.step{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border:1px solid var(--line);border-radius:9px;margin-bottom:6px;cursor:pointer;background:var(--sf2)}.step.done{opacity:.6;text-decoration:line-through}.step input{width:auto;margin:3px 0 0}.tier{font:600 10px "JetBrains Mono",monospace;padding:1px 6px;border-radius:5px;background:var(--sf);color:var(--vi);margin-left:auto;flex:none}
.prog{height:6px;background:var(--sf2);border-radius:3px;overflow:hidden;margin-bottom:10px}.prog i{display:block;height:100%;background:var(--ok);transition:width .3s}
.box{border-radius:9px;padding:11px 13px;font-size:13px}.box.fix{background:rgba(52,211,153,.12);border:1px solid var(--ok)}.box.esc{background:rgba(251,191,36,.12);border:1px solid var(--warn)}
.acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse}th{font:600 11px Inter;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}td{padding:10px;border-bottom:1px solid var(--line)}tr:last-child td{border:0}.scroll{overflow-x:auto}.empty{color:var(--mut);padding:18px;text-align:center}
#toast{position:fixed;top:74px;left:50%;transform:translateX(-50%) translateY(-30px);opacity:0;background:var(--ok);color:#04201a;font:600 14px Inter;padding:10px 22px;border-radius:30px;transition:.35s;z-index:9}#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:900px){.split{grid-template-columns:1fr}.det{position:static}header{flex-wrap:wrap;padding:10px 14px}main{padding:16px}}
</style>
</head>
<body>
<header><div class="brand"><i>&gt;_</i>Fix<span>Desk</span></div><nav id="nav"></nav><button class="btn alt" id="th" aria-label="Toggle theme">Theme</button></header>
<main id="view"></main><div id="toast"></div>
<script>
var CATS=["Account access","Applications","Connectivity","Performance","Peripherals"];
var RB=[
{id:"RB-01",c:0,t:"Locked out or forgotten password",m:8,s:"User cannot sign in; message says the account is locked or the password is wrong.",k:["B|Confirm the username, Caps Lock and keyboard layout","B|Check account status in the directory (locked, disabled, expired)","B|Check whether the password has expired","D|Review sign-in logs for repeated failures or unfamiliar locations","D|Clear stale saved credentials in Credential Manager"],f:"Verify identity, unlock the account, reset the password, clear stored credentials and confirm a clean sign-in.",e:"Escalate to the Identity team if policy disabled the account, or if sign-in logs look suspicious. Treat that as a security incident."},
{id:"RB-02",c:0,t:"MFA prompt not arriving",m:10,s:"User never receives the approval prompt or the code is rejected.",k:["B|Confirm the phone has signal and automatic date and time","B|Check authenticator notifications are enabled","D|Confirm the registered MFA method on the account","D|Compare device clock drift if codes are rejected"],f:"Re-register the MFA method after identity verification, then test a fresh sign-in.",e:"Escalate to the Identity team if the device is lost or the method must be reset by an admin."},
{id:"RB-03",c:1,t:"Application crashes on launch",m:15,s:"App closes immediately or shows an error as it opens.",k:["B|Restart the app and the PC, and check for a known outage","B|Install any pending updates","D|Read Event Viewer, Application log, for the faulting module","D|Repair or reinstall the application","D|Reset the app cache or user profile"],f:"Repair or reinstall, clear the cache, and confirm the app opens and a test file loads.",e:"Escalate to the app owner if several users are affected or the crash began after an update. Attach the event ID and version."},
{id:"RB-04",c:1,t:"Office app not responding",m:12,s:"Word or Excel freezes or will not open a particular file.",k:["B|Start the app in safe mode (hold Ctrl on launch)","B|Open a different file to separate file issues from app issues","D|Disable add-ins one at a time","D|Run Quick Repair, then Online Repair"],f:"Remove the faulty add-in or repair Office, then reopen the file.",e:"Escalate to L2 if the file is corrupt and needs recovery."},
{id:"RB-05",c:2,t:"Wi-Fi connected but no internet",m:15,s:"Network icon shows connected, but pages and apps do not load.",k:["B|Check whether other devices on the same network work","B|Toggle Wi-Fi or airplane mode and reconnect","D|Run ipconfig /all and look for a 169.254.x.x address","D|Run ipconfig /flushdns, then /release and /renew","D|Ping the gateway, then 8.8.8.8, then a hostname to separate routing from DNS"],f:"Renew the lease and flush DNS, or forget and rejoin the network. Confirm browsing works.",e:"Escalate to the Network team if the gateway is unreachable for several users or the DHCP scope looks exhausted."},
{id:"RB-06",c:2,t:"VPN will not connect",m:15,s:"VPN client fails or drops while the user works remotely.",k:["B|Confirm normal internet works first","B|Check credentials and the MFA prompt","D|Read the VPN client log for the error code","D|Reinstall the client and its virtual adapter","D|Check system time and local firewall rules"],f:"Fix the credential or time issue, or reinstall the client, then confirm an internal resource opens.",e:"Escalate to Network or Security if the gateway returns errors for several users."},
{id:"RB-07",c:3,t:"Slow PC, high CPU or memory",m:20,s:"Laptop is sluggish, fans spin hard, apps lag.",k:["B|Restart and note the uptime","B|Open Task Manager and find the top CPU, memory and disk process","D|Trim startup apps and confirm more than 15% free disk","D|Run sfc /scannow and DISM /RestoreHealth","D|Run a malware scan and check drive health"],f:"Stop or fix the offending process, free disk space, repair system files, and confirm normal load.",e:"Escalate for repair if drive health shows errors or the device shuts down from heat. Escalate to Security if malware is suspected."},
{id:"RB-08",c:3,t:"Slow remote desktop session",m:15,s:"Remote session lags, redraws slowly or disconnects.",k:["B|Check the user's home network and speed","B|Lower display quality and turn off heavy redirection options","D|Check CPU and memory on the host","D|Run ping -t to the host and watch for loss and latency"],f:"Tune session settings or fix the local network, then confirm smooth input.",e:"Escalate to Infrastructure if the host is overloaded."},
{id:"RB-09",c:4,t:"Printer offline or will not print",m:12,s:"Jobs queue forever or the printer shows offline.",k:["B|Check power, cable or network link, paper and toner","B|Set it as default and clear the print queue","D|Restart the Print Spooler service","D|Remove and re-add the printer, updating the driver","D|Print a test page from another device"],f:"Restart the spooler, reinstall the driver, and confirm a test page prints.",e:"Escalate to Print or Network teams for print server faults or hardware failure."},
{id:"RB-10",c:4,t:"External monitor or USB device not detected",m:10,s:"Plugged-in screen, headset or drive is not recognised.",k:["B|Reseat the cable and try another port or cable","B|Press Win+P and pick the right display mode","D|Check Device Manager for warnings, then update or roll back the driver","D|Test the device on another PC to isolate device from host"],f:"Replace the cable or reinstall the driver, then confirm the device works.",e:"Escalate for replacement if the device fails on a second PC."}];
var S={tab:"dash",cat:-1,q:"",sel:"RB-05",done:{},log:[],n:1006};
function seed(){var h=36e5,n=Date.now();S.log=[
{id:"INC-1001",r:"RB-05",w:"Priya N. · Laptop",o:"Resolved at L1",st:4,ts:n-50*h},{id:"INC-1002",r:"RB-01",w:"Karan S.",o:"Resolved at L1",st:3,ts:n-40*h},
{id:"INC-1003",r:"RB-06",w:"Neha R. · Laptop",o:"Escalated",st:5,ts:n-28*h},{id:"INC-1004",r:"RB-09",w:"Front desk",o:"Resolved at L1",st:4,ts:n-20*h},
{id:"INC-1005",r:"RB-07",w:"Amit D. · Desktop",o:"Resolved at L1",st:5,ts:n-6*h}]}
try{var d=JSON.parse(localStorage.getItem("fd")||"null");if(d&&d.log){S.log=d.log;S.n=d.n}else seed()}catch(e){seed()}
function save(){try{localStorage.setItem("fd",JSON.stringify({log:S.log,n:S.n}))}catch(e){}}
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function rb(id){return RB.filter(function(x){return x.id===id})[0]}
function ago(t){var h=Math.round((Date.now()-t)/36e5);return h<1?"just now":h<24?h+"h ago":Math.round(h/24)+"d ago"}
function bars(k,v){var m=Math.max.apply(null,v.concat([1]));return k.map(function(x,i){return'<div class="bar"><span>'+x+'</span><span class="t"><i style="width:'+Math.round(v[i]/m*100)+'%"></i></span><b>'+v[i]+'</b></div>'}).join("")}
function nav(){$("nav").innerHTML=[["dash","Overview"],["rb","Runbooks"],["log","Session log"]].map(function(x){return'<button class="nv" data-a="tab" data-v="'+x[0]+'"'+(S.tab===x[0]?' aria-current="page"':"")+'>'+x[1]+'</button>'}).join("")}
function dash(){var l=S.log,r=l.filter(function(x){return x.o==="Resolved at L1"}).length,avg=l.length?(l.reduce(function(s,x){return s+x.st},0)/l.length).toFixed(1):0;
var K=[["Runbooks",RB.length],["Sessions logged",l.length],["Resolved at L1",(l.length?Math.round(r/l.length*100):0)+"%"],["Avg steps / case",avg]];
return'<h1>Overview</h1><p class="sub">Structured L1 support: verify basics, collect evidence, then escalate with a clean handover.</p><div class="kpis">'+K.map(function(k){return'<div class="card kpi"><b>'+k[1]+'</b><span>'+k[0]+'</span></div>'}).join("")+'</div><div class="grid"><div class="card"><h2>Runbook coverage</h2>'+bars(CATS,CATS.map(function(c,i){return RB.filter(function(x){return x.c===i}).length}))+'</div><div class="card"><h2>Sessions by category</h2>'+bars(CATS,CATS.map(function(c,i){return l.filter(function(x){return rb(x.r).c===i}).length}))+'</div><div class="card"><h2>Recent sessions</h2>'+l.slice(-5).reverse().map(function(x){return'<div style="display:flex;gap:8px;align-items:center;padding:6px 0"><span class="mono" style="color:var(--mut)">'+x.id+'</span><span style="flex:1">'+esc(rb(x.r).t)+'</span><span class="pill '+(x.o==="Escalated"?"warn":"ok")+'">'+x.o+'</span></div>'}).join("")+'</div></div>'}
function rbs(){var q=S.q.toLowerCase(),l=RB.filter(function(x){return(S.cat<0||x.c===S.cat)&&(!q||(x.t+x.s+x.id).toLowerCase().indexOf(q)>-1)}),x=rb(S.sel),dn=S.done[x.id]||[],c=dn.filter(Boolean).length;
return'<h1>Runbooks</h1><p class="sub">Pick an issue, work the checks from basic to deeper, then resolve or escalate.</p><div class="split"><div><input id="q" placeholder="Search issues" value="'+esc(S.q)+'" aria-label="Search runbooks"><div class="chips">'+["All"].concat(CATS).map(function(n,i){return'<button class="chip" data-a="cat" data-v="'+(i-1)+'" aria-pressed="'+(S.cat===i-1)+'">'+n+'</button>'}).join("")+'</div>'+
(l.length?l.map(function(y){return'<button class="rb'+(y.id===S.sel?" on":"")+'" data-a="sel" data-v="'+y.id+'"><b>'+esc(y.t)+'</b><small>'+y.id+' · '+CATS[y.c]+' · ~'+y.m+' min</small></button>'}).join(""):'<p class="empty">No runbooks match.</p>')+'</div>'+
'<div class="card det"><span class="pill">'+CATS[x.c]+'</span> <span class="pill mono">'+x.id+'</span><h1>'+esc(x.t)+'</h1><p class="sub" style="margin-bottom:0">'+esc(x.s)+'</p><div class="lab">Diagnostic path · '+c+'/'+x.k.length+'</div><div class="prog"><i style="width:'+Math.round(c/x.k.length*100)+'%"></i></div>'+
x.k.map(function(k,i){var p=k.split("|");return'<label class="step'+(dn[i]?" done":"")+'"><input type="checkbox" data-a="chk" data-v="'+i+'"'+(dn[i]?" checked":"")+'><span>'+esc(p[1])+'</span><span class="tier">'+(p[0]==="B"?"BASIC":"DEEP")+'</span></label>'}).join("")+
'<div class="lab">Resolution</div><div class="box fix">'+esc(x.f)+'</div><div class="lab">Escalate when</div><div class="box esc">'+esc(x.e)+'</div><div class="lab">Log this session</div><input id="who" placeholder="User / device (e.g. Priya N. · Laptop)" aria-label="User or device"><div class="acts"><button class="btn ok" data-a="res">Mark resolved at L1</button><button class="btn bad" data-a="esc">Escalate to resolver group</button></div></div></div>'}
function logv(){return'<h1>Session log</h1><p class="sub">Every case with steps taken and outcome, ready for handover or reporting.</p><div class="card"><div style="text-align:right;margin-bottom:8px"><button class="btn alt" data-a="csv">Export CSV</button></div><div class="scroll"><table><thead><tr><th>Ticket</th><th>When</th><th>Issue</th><th>User / device</th><th>Steps</th><th>Outcome</th></tr></thead><tbody>'+S.log.slice().reverse().map(function(x){return'<tr><td class="mono">'+x.id+'</td><td>'+ago(x.ts)+'</td><td>'+esc(rb(x.r).t)+'</td><td>'+esc(x.w||"-")+'</td><td>'+x.st+'</td><td><span class="pill '+(x.o==="Escalated"?"warn":"ok")+'">'+x.o+'</span></td></tr>'}).join("")+'</tbody></table></div></div>'}
function view(){nav();$("view").innerHTML=S.tab==="dash"?dash():S.tab==="rb"?rbs():logv()}
function toast(t){var e=$("toast");e.textContent=t;e.className="on";setTimeout(function(){e.className=""},2200)}
function add(o){var x=rb(S.sel),c=(S.done[x.id]||[]).filter(Boolean).length,w=$("who").value.trim();S.log.push({id:"INC-"+S.n++,r:x.id,w:w||"Unspecified",o:o,st:c,ts:Date.now()});S.done[x.id]=[];save();toast(o==="Escalated"?"Escalated with notes · logged":"Resolved at L1 · logged")}
document.addEventListener("click",function(e){var t=e.target.closest("[data-a]");if(!t||t.tagName==="INPUT")return;var a=t.dataset.a;
if(a==="tab")S.tab=t.dataset.v;else if(a==="cat")S.cat=Number(t.dataset.v);else if(a==="sel")S.sel=t.dataset.v;else if(a==="res")add("Resolved at L1");else if(a==="esc")add("Escalated");
else if(a==="csv"){var r=[["Ticket","Issue","User/device","Steps","Outcome"]].concat(S.log.map(function(x){return[x.id,rb(x.r).t,x.w,x.st,x.o]}));try{var u=URL.createObjectURL(new Blob([r.map(function(z){return z.map(function(v){return'"'+String(v).replace(/"/g,'""')+'"'}).join(",")}).join("\n")],{type:"text/csv"})),l=document.createElement("a");l.href=u;l.download="support-sessions.csv";l.click()}catch(x){}return}
view()});
document.addEventListener("change",function(e){var t=e.target;if(t.dataset&&t.dataset.a==="chk"){var d=S.done[S.sel]=S.done[S.sel]||[];d[Number(t.dataset.v)]=t.checked;var w=$("who")?$("who").value:"";view();$("who").value=w}});
document.addEventListener("input",function(e){if(e.target.id==="q"){S.q=e.target.value;var p=e.target.selectionStart;view();var q=$("q");q.focus();q.setSelectionRange(p,p)}});
$("th").onclick=function(){var d=document.documentElement,n=d.dataset.theme==="light"?"dark":"light";d.dataset.theme=n;try{localStorage.setItem("fd-theme",n)}catch(e){}};
try{var th=localStorage.getItem("fd-theme");if(th)document.documentElement.dataset.theme=th}catch(e){}
view();
</script>
</body>
</html>
